<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECONNECT-US • Tools — Cloud Hub Build 1</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:white;display:flex;align-items:center;justify-content:center;height:100vh}
.box{text-align:center;max-width:420px;width:100%}
h1{margin-bottom:20px}
.btn{display:block;margin:12px auto;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:bold;cursor:pointer;width:100%}
.primary{background:#22d7c6;color:#042131}
.alt{background:#59a9ff;color:#042131}
.back{margin-top:20px;background:#444;color:white}
</style>
</head>
<body>
<div class="box">
  <h1>Tools</h1>
  <p style='color:#9fb2c8;font-size:.9rem;'>Core protected • Cloud record enabled</p>
  <div style="margin:0 auto 16px auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);max-width:420px;">
    <div id="cloudStatus" style="color:#cbd5e1;font-size:.9rem;">Connecting to the learner's Tools cloud record…</div>
    <div style="margin-top:8px;font-weight:bold;">Account: <span id="accountLabel">Checking…</span></div>
    <div style="margin-top:6px;font-weight:bold;">Last tool: <span id="lastToolLabel">None yet</span></div>
  </div>

  <button class="btn primary" data-tool-id="website-idea-studio" data-tool-name="Website Idea Studio" data-route="website-idea-studio.html">Website Idea Studio</button>
  <button class="btn alt" data-tool-id="budgeting" data-tool-name="Budgeting Demo" data-route="budgeting.html">Budgeting Demo</button>
  <button class="btn back" onclick="backHome()">Back to Home</button>
  <div style="margin-top:16px;color:#9fb2c8;font-size:.85rem;">© RECONNECT-US — All rights reserved • Tools Cloud Hub Build 1</div>
</div>
<script>
function backHome(){ window.location.href = '../index.html'; }
</script>


<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCzSiaYBDdpFNqUlsNtyvyLxRBu6SIJnQ",
  authDomain: "reconnect-us-hub.firebaseapp.com",
  projectId: "reconnect-us-hub",
  storageBucket: "reconnect-us-hub.firebasestorage.app",
  messagingSenderId: "891220836369",
  appId: "1:891220836369:web:6f2b4a09350b8d9fe0b1b0"
};

const firebaseApp = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const TOOLS = [
  ["website-idea-studio", "Website Idea Studio"],
  ["budgeting", "Budgeting Demo"]
];

let currentUser = null;
let toolsRecord = null;

function toolsDocRef(){
  return doc(db, "users", currentUser.uid, "appProgress", "tools");
}

function emptyToolRecord(name){
  return {
    name,
    status: "not-started",
    percent: 0,
    completed: false,
    lastActivityAt: null,
    data: {}
  };
}

function buildEmptyRecord(){
  const tools = {};
  TOOLS.forEach(([id, name]) => {
    tools[id] = emptyToolRecord(name);
  });

  return {
    appId: "tools",
    lastToolId: "",
    lastToolName: "",
    lastActivityAt: null,
    tools
  };
}

function updateUi(){
  document.getElementById("accountLabel").textContent =
    currentUser?.displayName ||
    currentUser?.email ||
    "Signed-in learner";

  document.getElementById("lastToolLabel").textContent =
    toolsRecord?.lastToolName ||
    "None yet";

  document.getElementById("cloudStatus").textContent =
    "Cloud record ready. Each tool will save into this learner's own tool section.";
}

async function ensureToolsRecord(){
  const ref = toolsDocRef();
  const snapshot = await getDoc(ref);
  const base = buildEmptyRecord();

  if(snapshot.exists()){
    const existing = snapshot.data();
    toolsRecord = {
      ...base,
      ...existing,
      tools: {
        ...base.tools,
        ...(existing.tools || {})
      }
    };

    await setDoc(ref, toolsRecord, { merge: true });
  }else{
    toolsRecord = base;
    await setDoc(ref, {
      ...toolsRecord,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
  }

  updateUi();
}

async function recordToolLaunch(toolId, toolName){
  if(!currentUser || !toolsRecord) return;

  const existingTool =
    toolsRecord.tools[toolId] ||
    emptyToolRecord(toolName);

  const updatedTool = {
    ...existingTool,
    name: toolName,
    status: existingTool.status === "not-started"
      ? "started"
      : existingTool.status,
    lastActivityAt: new Date().toISOString()
  };

  toolsRecord.lastToolId = toolId;
  toolsRecord.lastToolName = toolName;
  toolsRecord.lastActivityAt = new Date().toISOString();
  toolsRecord.tools[toolId] = updatedTool;

  await setDoc(toolsDocRef(), {
    appId: "tools",
    lastToolId: toolId,
    lastToolName: toolName,
    lastActivityAt: new Date().toISOString(),
    updatedAt: serverTimestamp(),
    [`tools.${toolId}`]: updatedTool
  }, { merge: true });

  updateUi();
}

document.querySelectorAll("[data-tool-id]").forEach(button => {
  button.addEventListener("click", async () => {
    const route = button.dataset.route;
    const toolId = button.dataset.toolId;
    const toolName = button.dataset.toolName;

    try{
      if(currentUser && toolsRecord){
        await recordToolLaunch(toolId, toolName);
      }
    }catch(error){
      console.error("Tools launch save failed:", error);
    }

    window.location.href = route;
  });
});

onAuthStateChanged(auth, async user => {
  currentUser = user || null;

  if(!user){
    document.getElementById("cloudStatus").textContent =
      "Sign in through RECONNECT-US to use Tools cloud saving.";
    document.getElementById("accountLabel").textContent = "Not signed in";
    return;
  }

  try{
    await ensureToolsRecord();
  }catch(error){
    console.error("Tools cloud record failed:", error);
    document.getElementById("cloudStatus").textContent =
      "The Tools cloud record could not be opened.";
  }
});
</script>

<script type="module"
  src="../reconnectus-core/reconnectus-access-guard.js"
  data-app-id="tools"
  data-login-url="../index.html">
</script>

</body>
</html>
