<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>RECONNECT-US Secure Login — Resilient Activity Build 10</title>
<style>
:root{--bg1:#03111b;--bg2:#0b2331;--bg3:#12384b;--text:#eef9ff;--muted:#b9d4df;--teal:#22d7c6;--blue:#59a9ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 20%,rgba(34,215,198,.16),transparent 28%),radial-gradient(circle at 80% 15%,rgba(89,169,255,.18),transparent 28%),linear-gradient(140deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.card{width:min(460px,96vw);padding:28px;border:1px solid rgba(157,234,255,.18);border-radius:26px;background:rgba(6,19,29,.94);box-shadow:0 30px 70px rgba(0,0,0,.45);text-align:center}
.logo{width:64px;height:64px;margin:auto;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:1.25rem;color:#062433;background:linear-gradient(135deg,var(--teal),var(--blue))}
h1{font-size:1.65rem;margin:16px 0 8px}p{color:var(--muted);line-height:1.55}
input{width:100%;padding:14px;border-radius:16px;border:0;margin:7px 0;font:inherit;color:#10264f}
button{width:100%;padding:14px;border:0;border-radius:16px;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}
.primary{background:linear-gradient(135deg,var(--teal),var(--blue));color:#042131}
.secondary{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.10)}
#message{display:none;margin-top:14px;color:#ffb6b6;line-height:1.45}
</style>
</head>
<body>
<div class="card">
  <div class="logo">RU</div>
  <h1>RECONNECT-US Secure Login</h1>
  <p>Sign in to open the areas and tools assigned to your account.</p>
  <input id="email" type="email" placeholder="Email address" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="primary">Sign In</button>
  <button id="resetBtn" class="secondary">Forgot Password</button>
  <div id="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  sendPasswordResetEmail,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCCzSiaYBDdpFNqUlsNtyvyLxRBu6SIJnQ",
  authDomain:"reconnect-us-hub.firebaseapp.com",
  projectId:"reconnect-us-hub",
  storageBucket:"reconnect-us-hub.firebasestorage.app",
  messagingSenderId:"891220836369",
  appId:"1:891220836369:web:6f2b4a09350b8d9fe0b1b0"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
await setPersistence(auth,browserLocalPersistence);

// Keep the Firebase login available while the user moves between
// RECONNECT-US pages. The dashboard's Sign Out button ends the session.

const byId=id=>document.getElementById(id);

function showMessage(text){
  const el=byId("message");
  el.textContent=text;
  el.style.display="block";
}

function friendly(error){
  const code=error?.code||"";
  if(code.includes("invalid-credential"))return"The email address or password is incorrect.";
  if(code.includes("too-many-requests"))return"Too many attempts. Wait a little and try again.";
  if(code.includes("network-request-failed"))return"There was a network problem.";
  if(code.includes("permission-denied"))return"Your login worked, but your RECONNECT-US profile could not be read.";
  return error?.message||"Something went wrong.";
}

const params=new URLSearchParams(location.search);
if(params.get("message")==="no-profile")showMessage("This account has not been added to RECONNECT-US Core.");
if(params.get("message")==="not-active")showMessage("This account is not active yet.");
if(params.get("message")==="profile-error")showMessage("Your account profile could not be checked.");

async function login(){
  const email=byId("email").value.trim();
  const password=byId("password").value;
  byId("message").style.display="none";
  if(!email||!password){showMessage("Enter your email address and password.");return}

  try{
    byId("loginBtn").disabled=true;
    const result=await signInWithEmailAndPassword(auth,email,password);
    const snap=await getDoc(doc(db,"users",result.user.uid));

    if(!snap.exists()){
      await signOut(auth);
      showMessage("This account has not been added to RECONNECT-US Core.");
      return;
    }

    const profile=snap.data();
    if(profile.status==="pending"){
      await signOut(auth);
      showMessage("This account is waiting for approval.");
      return;
    }
    if(profile.status!=="active"){
      await signOut(auth);
      showMessage("This account is disabled or inactive.");
      return;
    }

    // Activity logging should never block a valid login.
    try{
      await setDoc(
        doc(db,"users",result.user.uid),
        {
          lastLogin:serverTimestamp(),
          lastSeen:serverTimestamp(),
          updatedAt:serverTimestamp()
        },
        {merge:true}
      );
    }catch(activityError){
      console.warn("Last-login update was not saved:", activityError);
    }

    try{
      await setDoc(
        doc(db,"presence",result.user.uid),
        {
          uid:result.user.uid,
          email:result.user.email||profile.email||"",
          name:profile.name||result.user.displayName||"",
          role:profile.role||"learner",
          currentAppId:"dashboard",
          currentPage:"/dashboard.html",
          online:true,
          lastSeen:serverTimestamp(),
          updatedAt:serverTimestamp()
        },
        {merge:true}
      );
    }catch(presenceError){
      console.warn("Presence update was not saved:", presenceError);
    }

    location.replace("./dashboard.html?build=10&time="+Date.now());
  }catch(error){
    console.error(error);
    showMessage(friendly(error));
  }finally{
    byId("loginBtn").disabled=false;
  }
}

async function resetPassword(){
  const email=byId("email").value.trim();
  if(!email){showMessage("Enter your email address first.");return}
  try{
    await sendPasswordResetEmail(auth,email);
    showMessage("Password reset email sent.");
  }catch(error){
    showMessage(friendly(error));
  }
}

byId("loginBtn").addEventListener("click",login);
byId("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
byId("resetBtn").addEventListener("click",resetPassword);
</script>
</body>
</html>
