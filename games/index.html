<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECONNECT-US • Games — Cloud Hub Build 1</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b1220;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box{
  text-align:center;
  max-width:420px;
  width:100%;
}

h1{
  margin-bottom:20px;
}

.btn{
  display:block;
  margin:10px auto;
  padding:14px;
  border-radius:10px;
  border:none;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  width:100%;
}

.primary{
  background:#22d7c6;
  color:#042131;
}

.alt{
  background:#59a9ff;
  color:#042131;
}

.back{
  margin-top:20px;
  background:#444;
  color:white;
}
</style>
</head>

<body>

<div class="box">
  <h1>Games & Learning</h1>
  <p style="color:#9fb2c8;font-size:.9rem;margin-top:-8px;">Core protected • Cloud record enabled</p>
  <div style="margin:0 auto 16px auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);max-width:420px;">
    <div id="cloudStatus" style="color:#cbd5e1;font-size:.9rem;">Connecting to the learner's Games cloud record…</div>
    <div style="margin-top:8px;font-weight:bold;">Account: <span id="accountLabel">Checking…</span></div>
    <div style="margin-top:6px;font-weight:bold;">Last game: <span id="lastGameLabel">None yet</span></div>
  </div>

  <button class="btn primary" data-game-id="money-builder" data-game-name="Money Builder" data-route="money/index.html">
    Money Builder
  </button>

  <button class="btn primary" data-game-id="clock-learning" data-game-name="Clock Learning" data-route="clock/index.html">
    Clock Learning
  </button>

  <button class="btn alt" data-game-id="word-search" data-game-name="Word Search" data-route="wordsearch/index.html">
    Word Search
  </button>

  <button class="btn alt" data-game-id="ball-sort" data-game-name="Ball Sort Game" data-route="ballsort/index.html">
    Ball Sort Game
  </button>

  <button class="btn primary" data-game-id="draughts-chess" data-game-name="Draughts & Chess" data-route="draughts-chess/index.html">
    Draughts & Chess
  </button>

  <button class="btn back" onclick="backHome()">
    Back to Home
  </button>

  <div style="margin-top:16px;color:#9fb2c8;font-size:.85rem;">© RECONNECT-US — All rights reserved • Games Cloud Hub Build 1</div>
</div>

<script>
function backHome(){
  window.location.href = "../index.html";
}
</script>



<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCzSiaYBDdpFNqUlsNtyvyLxRBu6SIJnQ",
  authDomain: "reconnect-us-hub.firebaseapp.com",
  projectId: "reconnect-us-hub",
  storageBucket: "reconnect-us-hub.firebasestorage.app",
  messagingSenderId: "891220836369",
  appId: "1:891220836369:web:6f2b4a09350b8d9fe0b1b0"
};

const firebaseApp = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const GAMES = [
  ["money-builder", "Money Builder"],
  ["clock-learning", "Clock Learning"],
  ["word-search", "Word Search"],
  ["ball-sort", "Ball Sort Game"],
  ["draughts-chess", "Draughts & Chess"]
];

let currentUser = null;
let gamesRecord = null;

function gamesDocRef(){
  return doc(db, "users", currentUser.uid, "appProgress", "games");
}

function emptyGameRecord(name){
  return {
    name,
    status: "not-started",
    percent: 0,
    score: 0,
    completed: false,
    lastActivityAt: null,
    data: {}
  };
}

function buildEmptyRecord(){
  const games = {};
  GAMES.forEach(([id, name]) => {
    games[id] = emptyGameRecord(name);
  });

  return {
    appId: "games",
    lastGameId: "",
    lastGameName: "",
    lastActivityAt: null,
    games
  };
}

function updateUi(){
  document.getElementById("accountLabel").textContent =
    currentUser?.displayName ||
    currentUser?.email ||
    "Signed-in learner";

  document.getElementById("lastGameLabel").textContent =
    gamesRecord?.lastGameName ||
    "None yet";

  document.getElementById("cloudStatus").textContent =
    "Cloud record ready. Each game will save into this learner's own game section.";
}

async function ensureGamesRecord(){
  const ref = gamesDocRef();
  const snapshot = await getDoc(ref);
  const base = buildEmptyRecord();

  if(snapshot.exists()){
    const existing = snapshot.data();
    gamesRecord = {
      ...base,
      ...existing,
      games: {
        ...base.games,
        ...(existing.games || {})
      }
    };

    await setDoc(ref, gamesRecord, { merge: true });
  }else{
    gamesRecord = base;
    await setDoc(ref, {
      ...gamesRecord,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
  }

  updateUi();
}

async function recordGameLaunch(gameId, gameName){
  if(!currentUser || !gamesRecord) return;

  const existingGame =
    gamesRecord.games[gameId] ||
    emptyGameRecord(gameName);

  const updatedGame = {
    ...existingGame,
    name: gameName,
    status: existingGame.status === "not-started" ? "started" : existingGame.status,
    lastActivityAt: new Date().toISOString()
  };

  gamesRecord.lastGameId = gameId;
  gamesRecord.lastGameName = gameName;
  gamesRecord.lastActivityAt = new Date().toISOString();
  gamesRecord.games[gameId] = updatedGame;

  await setDoc(gamesDocRef(), {
    appId: "games",
    lastGameId: gameId,
    lastGameName: gameName,
    lastActivityAt: new Date().toISOString(),
    updatedAt: serverTimestamp(),
    [`games.${gameId}`]: updatedGame
  }, { merge: true });

  updateUi();
}

document.querySelectorAll("[data-game-id]").forEach(button => {
  button.addEventListener("click", async () => {
    const route = button.dataset.route;
    const gameId = button.dataset.gameId;
    const gameName = button.dataset.gameName;

    try{
      if(currentUser && gamesRecord){
        await recordGameLaunch(gameId, gameName);
      }
    }catch(error){
      console.error("Game launch save failed:", error);
    }

    window.location.href = route;
  });
});

onAuthStateChanged(auth, async user => {
  currentUser = user || null;

  if(!user){
    document.getElementById("cloudStatus").textContent =
      "Sign in through RECONNECT-US to use Games cloud saving.";
    document.getElementById("accountLabel").textContent = "Not signed in";
    return;
  }

  try{
    await ensureGamesRecord();
  }catch(error){
    console.error("Games cloud record failed:", error);
    document.getElementById("cloudStatus").textContent =
      "The Games cloud record could not be opened.";
  }
});
</script>

<script type="module"
  src="../reconnectus-core/reconnectus-access-guard.js"
  data-app-id="games"
  data-login-url="../index.html">
</script>

</body>
</html>
