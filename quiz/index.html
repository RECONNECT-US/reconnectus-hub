<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RECONNECT-US Quiz — Cloud Hub Build 1</title>

<style>
:root{
  --bg1:#0c2a52;
  --bg2:#1d4f8f;
  --bg3:#2f6fba;
  --panel:#ffffff;
  --text:#15304f;
  --muted:#5c7188;
  --accent:#2f7de1;
  --border:#d5e1ef;
  --shadow:0 14px 36px rgba(6,24,49,.18);
  --radius:24px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(145deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.container{
  width:95%;
  max-width:900px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:1.8rem;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.tile{
  background:var(--panel);
  color:var(--text);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.tile h2{
  margin:0 0 10px;
  font-size:1.3rem;
}

.tile p{
  margin:0;
  color:var(--muted);
  font-size:0.95rem;
}

.btn{
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:16px;
  background:var(--accent);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
}

.btn:hover{
  opacity:0.9;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>RECONNECT-US Quiz</h1>
    <p style='color:#d8e8ff;font-size:.9rem;margin-top:8px;'>Core protected • Cloud record enabled</p>
  </div>

  <div style="background:#ffffff;color:#15304f;border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 14px 36px rgba(6,24,49,.18);">
    <h2 style="margin:0 0 8px;font-size:1.2rem;">☁ Cloud progress</h2>
    <p id="cloudStatus" style="margin:0;color:#5c7188;">Connecting to the learner's Quiz cloud record…</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;">
      <div style="padding:12px;border:1px solid #d5e1ef;border-radius:16px;">Account: <strong id="accountLabel">Checking…</strong></div>
      <div style="padding:12px;border:1px solid #d5e1ef;border-radius:16px;">Last quiz: <strong id="lastQuizLabel">None yet</strong></div>
    </div>
  </div>

  <div class="grid">

    <div class="tile">
      <div>
        <h2>🎮 Quiz 1</h2>
        <p>Online Survival Game</p>
      </div>
      <button class="btn" data-quiz-id="online-survival" data-quiz-name="Online Survival Game" data-route="./online-survival/index.html">
        Open
      </button>
    </div>

    <div class="tile">
      <div>
        <h2>🧠 Quiz 2</h2>
        <p>Scam Spotter Pro</p>
      </div>
      <button class="btn" data-quiz-id="scam-spotter" data-quiz-name="Scam Spotter Pro" data-route="./scam-spotter/index.html">
        Open
      </button>
    </div>

  </div>

  <div style="margin-top:18px;text-align:center;color:#d8e8ff;font-size:.85rem;">© RECONNECT-US — All rights reserved • Quiz Cloud Hub Build 1</div>

</div>


<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCzSiaYBDdpFNqUlsNtyvyLxRBu6SIJnQ",
  authDomain: "reconnect-us-hub.firebaseapp.com",
  projectId: "reconnect-us-hub",
  storageBucket: "reconnect-us-hub.firebasestorage.app",
  messagingSenderId: "891220836369",
  appId: "1:891220836369:web:6f2b4a09350b8d9fe0b1b0"
};

const firebaseApp = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const QUIZZES = [
  ["online-survival", "Online Survival Game"],
  ["scam-spotter", "Scam Spotter Pro"]
];

let currentUser = null;
let quizRecord = null;

function quizDocRef(){
  return doc(db, "users", currentUser.uid, "appProgress", "quiz");
}

function emptyQuizRecord(name){
  return { name, status:"not-started", percent:0, score:0, completed:false, lastActivityAt:null, data:{} };
}

function buildEmptyRecord(){
  const quizzes = {};
  QUIZZES.forEach(([id, name]) => quizzes[id] = emptyQuizRecord(name));
  return { appId:"quiz", lastQuizId:"", lastQuizName:"", lastActivityAt:null, quizzes };
}

function updateUi(){
  document.getElementById("accountLabel").textContent =
    currentUser?.displayName || currentUser?.email || "Signed-in learner";
  document.getElementById("lastQuizLabel").textContent =
    quizRecord?.lastQuizName || "None yet";
  document.getElementById("cloudStatus").textContent =
    "Cloud record ready. Each quiz will save into this learner's own quiz section.";
}

async function ensureQuizRecord(){
  const ref = quizDocRef();
  const snapshot = await getDoc(ref);
  const base = buildEmptyRecord();

  if(snapshot.exists()){
    const existing = snapshot.data();
    quizRecord = {
      ...base,
      ...existing,
      quizzes: { ...base.quizzes, ...(existing.quizzes || {}) }
    };
    await setDoc(ref, quizRecord, { merge:true });
  }else{
    quizRecord = base;
    await setDoc(ref, { ...quizRecord, createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
  }

  updateUi();
}

async function recordQuizLaunch(quizId, quizName){
  if(!currentUser || !quizRecord) return;

  const existingQuiz = quizRecord.quizzes[quizId] || emptyQuizRecord(quizName);
  const updatedQuiz = {
    ...existingQuiz,
    name: quizName,
    status: existingQuiz.status === "not-started" ? "started" : existingQuiz.status,
    lastActivityAt: new Date().toISOString()
  };

  quizRecord.lastQuizId = quizId;
  quizRecord.lastQuizName = quizName;
  quizRecord.lastActivityAt = new Date().toISOString();
  quizRecord.quizzes[quizId] = updatedQuiz;

  await setDoc(quizDocRef(), {
    appId:"quiz",
    lastQuizId:quizId,
    lastQuizName:quizName,
    lastActivityAt:new Date().toISOString(),
    updatedAt:serverTimestamp(),
    quizzes: {
      [quizId]: updatedQuiz
    }
  }, { merge:true });

  updateUi();
}

document.querySelectorAll("[data-quiz-id]").forEach(button => {
  button.addEventListener("click", async () => {
    const route = button.dataset.route;
    try{
      if(currentUser && quizRecord){
        await recordQuizLaunch(button.dataset.quizId, button.dataset.quizName);
      }
    }catch(error){
      console.error("Quiz launch save failed:", error);
    }
    window.location.href = route;
  });
});

onAuthStateChanged(auth, async user => {
  currentUser = user || null;

  if(!user){
    document.getElementById("cloudStatus").textContent =
      "Sign in through RECONNECT-US to use Quiz cloud saving.";
    document.getElementById("accountLabel").textContent = "Not signed in";
    return;
  }

  try{
    await ensureQuizRecord();
  }catch(error){
    console.error("Quiz cloud record failed:", error);
    document.getElementById("cloudStatus").textContent =
      "The Quiz cloud record could not be opened.";
  }
});
</script>

<script type="module"
  src="../reconnectus-core/reconnectus-access-guard.js"
  data-app-id="quiz"
  data-login-url="../index.html">
</script>

</body>
</html>
